# Render Blueprint: New → Blueprint → pick this repo.
services:
  - type: web
    name: nawat-invites
    runtime: docker
    plan: starter            # a paid plan is needed for the persistent disk (uploads)
    region: frankfurt        # closest Render region to Oman
    healthCheckPath: /login
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: APP_SECRET
        generateValue: true  # never change it after launch
      - key: DATABASE_URL
        fromDatabase: { name: nawat-db, property: connectionString }
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        sync: false          # set it in the dashboard, or read the generated one in the first deploy log

databases:
  - name: nawat-db
    plan: basic-256mb
    region: frankfurt
    databaseName: nawat
    postgresMajorVersion: "16"
