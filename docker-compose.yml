# Single-server production setup: app + PostgreSQL + Caddy (automatic HTTPS).
#   cp .env.example .env   (set APP_URL, APP_SECRET, POSTGRES_PASSWORD, DOMAIN)
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nawat
      POSTGRES_USER: nawat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nawat -d nawat"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      APP_URL: ${APP_URL:?set APP_URL}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      DATABASE_URL: postgres://nawat:${POSTGRES_PASSWORD}@db:5432/nawat
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes: [uploads:/data/uploads]
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN, e.g. invites.nawat.om}" }
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes: { pgdata: {}, uploads: {}, caddy_data: {}, caddy_config: {} }
